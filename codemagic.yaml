# Codemagic build for the touch-friendly iPhone menus (GitHub's Mac runners refused this
# new account). Same steps as .github/workflows/iphone-menus.yml, all on one Mac.
workflows:
  ios-touch-menus:
    name: iPhone menu build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      # Pinned: the published IPA was built with Xcode 16.4 (iOS 18.5 SDK); Xcode 26 breaks the CoreAudio headers.
      xcode: 16.4
      vars:
        SOH_IOS_VERSION: 9.3.1
        # Higher than the published build (20) so it installs over it and keeps saves.
        SOH_IOS_BUILD_NUMBER: "22"
        SOH_IOS_DISPLAY_NAME: Ship of Harkinian
        SOH_ENABLE_ICLOUD: "OFF"
        DEPLOYMENT_TARGET: "15.0"
        CMAKE_BUILD_PARALLEL_LEVEL: "4"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: iphone-menus
          include: true
          source: true
    scripts:
      - name: Submodules
        script: git submodule update --init --recursive
      # Same tools as the author's own iOS job. Installing Homebrew's libzip/libpng here made the
      # iPhone link pick up the Mac zlib/bzip2 (build #2 failed at the final link).
      - name: Build tools
        script: brew install cmake ninja pkg-config
      # This image ships Homebrew libraries the GitHub runner lacks. CMake's find_package takes the Mac
      # libzip/SDL2/etc. before fetching iPhone copies, and the link then fails on the Mac zlib/bzip2
      # (builds #2 and #3). Remove them so ios.cmake builds its own.
      - name: Remove Mac-only Homebrew libraries
        script: |
          for f in libzip libpng sdl2 spdlog fmt tinyxml2 nlohmann-json glew zlib bzip2 libogg libvorbis opus opusfile; do
            if brew list --versions "$f" >/dev/null 2>&1; then brew uninstall --ignore-dependencies --force "$f"; fi
          done
          ls "$(brew --prefix)/lib/cmake" 2>/dev/null || true
      # The ROM-free support archive is taken from the published 9.3.1 IPA (same source tree),
      # so no host libraries are needed on this machine.
      - name: Get ROM-free support archive (soh.o2r)
        script: |
          curl -fsSL -o /tmp/soh-release.ipa https://github.com/linkzenic/Shipwright-Ports/releases/download/v9.3.1-ports.2/Ship-of-Harkinian-9.3.1-iOS-unsigned.ipa
          unzip -p /tmp/soh-release.ipa 'Payload/Ship of Harkinian.app/soh.o2r' > soh/soh.o2r
          ls -la soh/soh.o2r
      - name: Build iPhone app
        script: |
          # CMake 4 takes the SDK from SDKROOT when nothing sets CMAKE_OSX_SYSROOT. Unset here, it
          # found bzip2/zlib in the Mac SDK and the iPhone link failed (builds #2-#4).
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          scripts/build-ios.sh --device || {
            grep -iE "^(libzip|ZLIB|BZIP2|SDL2|PNG)[A-Z_]*(DIR|LIBRARY[A-Z_]*):" build-ios-device/CMakeCache.txt || true
            exit 1
          }
      - name: Package unsigned IPA
        script: scripts/package-ios-unsigned.sh 'build-ios-device/soh/Release-iphoneos/Ship of Harkinian.app' 'dist/Ship-of-Harkinian-9.3.1-iOS-touch-menus-savestates-unsigned.ipa'
    artifacts:
      - dist/*.ipa
